<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Connecting | AI Verse</title>
<link rel="icon" href="favicon.ico">
<style>
:root{--bg:#fff;--ink:#111;--muted:#6e6c68}
@media (prefers-color-scheme:dark){:root{--bg:#111;--ink:#f3f2ef;--muted:#a3a19c}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
h1{font-size:20px;margin:0 0 6px}p{color:var(--muted);margin:0}
</style>
</head>
<body>
<main><h1 id="t">Connecting…</h1><p id="m">You can close this window if it doesn't close by itself.</p></main>
<script>
(function(){
  var p=new URLSearchParams(location.search), h=new URLSearchParams(location.hash.slice(1));
  var d={aivOAuth:true,state:p.get('state')||h.get('state')||'',code:p.get('code')||'',error:p.get('error')||h.get('error')||'',scope:p.get('scope')||''};
  try{localStorage.setItem('aivconnect.cb',JSON.stringify(d));}catch(e){}
  try{if(window.opener)window.opener.postMessage(d,location.origin);}catch(e){}
  document.getElementById('t').textContent=d.error?'Sign-in was cancelled':'Connected';
  history.replaceState(null,'',location.pathname);
  setTimeout(function(){window.close();},600);
})();
</script>
</body>
</html>
