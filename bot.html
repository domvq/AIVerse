<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Chat</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: a customer's live chatbot — colored header, message column, docked input. Full page when shared, compact inside the website bubble. */
:root{
  --bg:#ffffff;--fg:#111111;--muted:#6e6c68;--soft:#9b9893;--pill:#efeeeb;--line:#e7e5e1;--bad:#b42318;
  --accent:#111111;--on-accent:#ffffff;
  --body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f0e;--fg:#f2f1ee;--muted:#a3a09a;--soft:#77746f;--pill:#22211f;--line:#2a2927;--bad:#f2766b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0f0e;--fg:#f2f1ee;--muted:#a3a09a;--soft:#77746f;--pill:#22211f;--line:#2a2927;--bad:#f2766b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
.app{width:100%;max-width:720px;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body:not(.embed) .app{border-inline:1px solid var(--line)}
.head{flex:none;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.av{flex:none;width:38px;height:38px;border-radius:50%;background:color-mix(in srgb,var(--on-accent) 18%,transparent);display:grid;place-items:center;font:600 16px/1 var(--body)}
.meta{flex:1;min-width:0}
.meta b{display:block;font-weight:600;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta small{opacity:.8;font-size:12.5px}
.close{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:inherit;font-size:24px;line-height:1;cursor:pointer}
.close:hover{background:color-mix(in srgb,var(--on-accent) 15%,transparent)}
.body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.b{max-width:85%;padding:9px 13px;border-radius:16px;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.b.bot{align-self:flex-start;background:var(--pill);border-bottom-left-radius:6px}
.b.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:6px;white-space:pre-wrap}
.b.err{color:var(--bad)}
.b p{margin:0 0 8px}.b p:last-child{margin:0}
.b ul,.b ol{margin:0 0 8px;padding-left:20px}
.b a{color:inherit}
.dots{display:inline-flex;gap:4px;padding:4px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--soft);animation:bl 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
.state{margin:auto;text-align:center;color:var(--muted);max-width:30ch}
.state b{display:block;color:var(--fg);font-weight:500;margin-bottom:6px}
.in{flex:none;display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line);padding-block:10px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.in textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);font:400 15px/1.45 var(--body);resize:none;padding:9px 0;max-height:120px}
.send{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:pointer}
.send:disabled{opacity:.3;cursor:not-allowed}
.send svg{width:17px;height:17px}
.foot{flex:none;text-align:center;font-size:11.5px;color:var(--soft);padding:0 0 10px}
.foot a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

/* phones: tapping a text box never zooms the page (iOS zooms text under 16px) */
@media (pointer:coarse),(max-width:900px){input,textarea,select,[contenteditable]{font-size:16px!important}}
</style>
</head>
<body>
<main class="app">
  <header class="head">
    <div class="av" id="av" aria-hidden="true">·</div>
    <div class="meta"><b id="name">Loading…</b><small id="sub">&nbsp;</small></div>
    <button class="close" id="closeBtn" type="button" aria-label="Close chat" hidden>×</button>
  </header>
  <div class="body" id="body" aria-live="polite"></div>
  <form class="in" id="form" hidden>
    <label for="input" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Message</label>
    <textarea id="input" rows="1" maxlength="2000" placeholder="Type your question"></textarea>
    <button class="send" id="send" type="submit" aria-label="Send" disabled><svg viewBox="0 0 20 20"><path d="M10 16V4M5 9l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </form>
  <div class="foot">You're chatting with an AI. Answers may be wrong · Powered by <a href="index.html" target="_blank" rel="noopener">AI Verse</a> · <a href="privacy.html" target="_blank" rel="noopener">Privacy</a></div>
</main>
<script src="config.js"></script>
<script>
(()=>{
'use strict';
const SERVER=((window.AIV_SITE&&window.AIV_SITE.server)||'').replace(/\/+$/,'');
const q=new URLSearchParams(location.search), id=q.get('id')||'', embed=q.get('embed')==='1';
const $=x=>document.getElementById(x);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(embed){document.body.classList.add('embed');$('closeBtn').hidden=false;$('closeBtn').onclick=()=>parent.postMessage({type:'aiv-close'},'*');}
const KEY='aiv.bot.'+id;let msgs=[];try{msgs=JSON.parse(sessionStorage.getItem(KEY)||'[]');}catch(e){}
const persist=()=>{try{sessionStorage.setItem(KEY,JSON.stringify(msgs.slice(-30)));}catch(e){}};
let bot=null,busy=false;
function onColor(hex){const n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;const L=[r,g,b].map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4;});return (.2126*L[0]+.7152*L[1]+.0722*L[2])>.4?'#111111':'#ffffff';}
function inline(s){return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');}
function md(t){let h='',L=null;const close=()=>{if(L){h+=`</${L}>`;L=null;}};for(const l of esc(t).split('\n')){let m;if((m=l.match(/^\s*[-*•]\s+(.*)/))){if(L!=='ul'){close();h+='<ul>';L='ul';}h+=`<li>${inline(m[1])}</li>`;continue;}if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(L!=='ol'){close();h+='<ol>';L='ol';}h+=`<li>${inline(m[1])}</li>`;continue;}close();if(l.trim())h+=`<p>${inline(l.replace(/^#+\s*/,''))}</p>`;}close();return h;}
function stateMsg(title,text){$('body').innerHTML=`<div class="state"><b>${esc(title)}</b>${esc(text)}</div>`;$('form').hidden=true;}
function render(){
  const b=$('body');b.innerHTML=`<div class="b bot">${md(bot.greeting||'Hi! How can I help you today?')}</div>`+msgs.map(m=>m.role==='user'?`<div class="b me">${esc(m.content)}</div>`:`<div class="b bot${m.error?' err':''}">${md(m.content)}</div>`).join('');
  b.scrollTop=b.scrollHeight;$('send').disabled=busy||!$('input').value.trim();
}
async function start(){
  if(!SERVER||!/^[a-zA-Z0-9]{10,16}$/.test(id)){$('name').textContent='Chat';stateMsg('This chat isn\'t available','Check the link you were given, or ask the person who shared it.');return;}
  try{const r=await fetch(`${SERVER}/bots/${encodeURIComponent(id)}`);if(!r.ok)throw new Error(String(r.status));bot=await r.json();}
  catch(e){$('name').textContent='Chat';stateMsg('This chat isn\'t available','Check the link you were given, or ask the person who shared it.');return;}
  const c=/^#[0-9a-f]{6}$/i.test(bot.color||'')?bot.color:'#111111';
  document.documentElement.style.setProperty('--accent',c);document.documentElement.style.setProperty('--on-accent',onColor(c));
  $('name').textContent=bot.name;$('av').textContent=(bot.name.trim()[0]||'A').toUpperCase();document.title=bot.name;
  if(bot.status!=='active'){$('sub').textContent='Offline';stateMsg('This chatbot isn\'t live yet',bot.kind==='personal'?'It hasn\'t been switched on yet. Please check back soon.':`${bot.business||'This business'} hasn't switched it on. Please contact them directly.`);return;}
  $('sub').textContent='AI assistant · Online';$('form').hidden=false;render();if(!embed)$('input').focus();
}
async function send(text){
  text=text.trim();if(!text||busy||!bot)return;
  msgs=msgs.filter(m=>!m.error);msgs.push({role:'user',content:text});$('input').value='';$('input').style.height='';busy=true;render();
  const el=document.createElement('div');el.className='b bot';el.innerHTML='<span class="dots" aria-label="Typing"><i></i><i></i><i></i></span>';$('body').appendChild(el);$('body').scrollTop=$('body').scrollHeight;
  let out='';
  try{
    const once=async()=>{
      const r=await fetch(`${SERVER}/bots/${encodeURIComponent(id)}/chat`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stream:true,messages:msgs.slice(-12)})});
      if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error((j.error&&j.error.message)||'Something went wrong. Please try again.');}
      const reader=r.body.getReader(),dec=new TextDecoder();let buf='';
      outer:for(;;){const{done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line.startsWith('data:'))continue;const d=line.slice(5).trim();if(d==='[DONE]')break outer;try{const t=JSON.parse(d).choices?.[0]?.delta?.content;if(t){out+=t;el.innerHTML=md(out);$('body').scrollTop=$('body').scrollHeight;}}catch(_){}}}
    };
    await once();
    // the server sometimes sends back an empty answer: ask once more before giving up
    if(!out.trim()){out='';await once();}
    if(out.trim())msgs.push({role:'assistant',content:out.trim()});
    else msgs.push({role:'assistant',content:'Sorry, I couldn\'t answer just now. Please send your message again.',error:true});
  }catch(e){msgs.push({role:'assistant',content:e.message.includes('fetch')?'Couldn\'t connect. Check your internet and try again.':e.message,error:true});}
  finally{busy=false;persist();render();$('input').focus({preventScroll:true});}
}
$('form').addEventListener('submit',e=>{e.preventDefault();send($('input').value);});
$('input').addEventListener('input',()=>{const t=$('input');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px';$('send').disabled=busy||!t.value.trim();});
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send($('input').value);}});
start();
})();
</script>
</body>
</html>
