<style>
/* Layout: one-screen chat app — slim site header, centered greeting + pill composer when empty, conversation column with docked composer once chatting. */
:root{
  --bg:#ffffff;--fg:#111111;--muted:#6e6c68;--soft:#9b9893;--card:#f6f5f3;--pill:#efeeeb;--line:#e7e5e1;
  --ink-btn:#111111;--ink-btn-fg:#ffffff;--bad:#b42318;--field:#ffffff;--glow:rgba(17,17,17,.035);
  --display:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0c0c;--fg:#f2f1ee;--muted:#a3a09a;--soft:#77746f;--card:#171716;--pill:#22211f;--line:#2a2927;--ink-btn:#f2f1ee;--ink-btn-fg:#0c0c0c;--bad:#f2766b;--field:#151514;--glow:rgba(255,255,255,.03);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0c0c;--fg:#f2f1ee;--muted:#a3a09a;--soft:#77746f;--card:#171716;--pill:#22211f;--line:#2a2927;--ink-btn:#f2f1ee;--ink-btn-fg:#0c0c0c;--bad:#f2766b;--field:#151514;--glow:rgba(255,255,255,.03);color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:400 15px/1.6 var(--body);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
a{color:inherit}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{flex:none;border-bottom:1px solid var(--line)}
.nav{max-width:1232px;margin:0 auto;display:flex;align-items:center;gap:28px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand svg{height:20px;width:auto;display:block}
.brand span{font-weight:600;font-size:15px;letter-spacing:-.01em}
.links{display:flex;gap:26px;font-size:14px}
.links a{text-decoration:none;opacity:.85}.links a:hover,.links a[aria-current]{opacity:1}
.links a[aria-current]{font-weight:500}
.nav .right{margin-left:auto;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 16px;font:500 14px/1 var(--body);text-decoration:none;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--pill)}
.btn svg{width:15px;height:15px}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

main{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto}

/* empty state */
.start{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-block:40px 12vh;position:relative}
.start::before{content:"";position:absolute;left:50%;top:44%;width:min(760px,90%);height:220px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none}
.start h1{font:400 clamp(24px,3.4vw,30px)/1.2 var(--display);letter-spacing:-.015em;margin:0 0 26px;text-align:center;position:relative}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px;max-width:680px;position:relative}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--fg);font:400 13.5px/1 var(--body);padding:9px 14px;border-radius:999px;cursor:pointer}
.chip:hover{background:var(--pill)}

/* composer */
.composer{width:100%;max-width:680px;position:relative}
.box{display:flex;align-items:flex-end;gap:6px;background:var(--field);border:1px solid var(--line);border-radius:28px;padding:8px 8px 8px 18px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.04)}
.box:focus-within{border-color:color-mix(in srgb,var(--fg) 30%,var(--line))}
.box textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);font:400 15.5px/1.5 var(--body);resize:none;padding:8px 0;max-height:200px}
.box textarea::placeholder{color:var(--soft)}
.ibtn{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--fg);display:grid;place-items:center;cursor:pointer}
.ibtn:hover{background:var(--pill)}
.ibtn svg{width:18px;height:18px}
.ibtn.rec{color:var(--bad)}
.send{background:var(--ink-btn);color:var(--ink-btn-fg)}
.send:hover{background:var(--ink-btn);opacity:.85}
.send:disabled{opacity:.25;cursor:default}
.fine{font-size:12px;color:var(--soft);text-align:center;margin:8px 0 0}

/* conversation */
.thread{max-width:760px;margin:0 auto;padding-block:28px 24px;display:flex;flex-direction:column;gap:26px}
.msg{min-width:0}
.msg.me{align-self:flex-end;max-width:80%;background:var(--pill);border-radius:22px;padding:10px 18px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai{display:grid;grid-template-columns:28px minmax(0,1fr);gap:14px;align-items:start}
.av{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;margin-top:1px}
.av svg{width:17px;height:auto}
.md{overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md p{margin:0 0 12px}
.md ul,.md ol{margin:0 0 12px;padding-left:22px}.md li{margin:4px 0}
.md h4{font:600 15px/1.4 var(--body);margin:16px 0 6px}
.md code{font:400 13px var(--mono);background:var(--pill);border-radius:6px;padding:1px 5px}
.md pre{background:var(--card);border-radius:12px;padding:12px 14px;overflow-x:auto;font:400 13px/1.5 var(--mono);margin:0 0 12px}
.md a{text-underline-offset:3px}
.md.err{color:var(--bad)}
.tools{display:flex;gap:2px;margin-top:6px;margin-left:-8px}
.tools button{border:0;background:transparent;color:var(--muted);font:400 12.5px var(--body);padding:5px 8px;border-radius:8px;cursor:pointer}
.tools button:hover{background:var(--pill);color:var(--fg)}
.dots{display:inline-flex;gap:4px;padding-top:9px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--soft);animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.6}}
.dock{flex:none;padding-block:8px 14px;background:var(--bg)}
.dock .composer{margin:0 auto;max-width:760px}

@media (max-width:820px){.links{display:none}}
@media (max-width:480px){.nav .right .hide-s{display:none}.msg.me{max-width:90%}.msg.ai{grid-template-columns:1fr}.av{display:none}}

/* ===== shared site header (identical on every page) ===== */
header.sitehead{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;flex:none;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.sitehead .bar{max-width:1232px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sitehead .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.sitehead .brand svg{height:22px;width:auto;display:block;flex:none}
.sitehead .brand span{white-space:nowrap}
.sitehead .brand span{font:600 15px/1 var(--body);letter-spacing:-.01em}
.sitehead .tabs{display:flex;justify-content:center;gap:2px;min-width:0}
.sitehead .tabs a{flex:0 0 auto;min-width:80px;text-align:center;padding:9px 11px;border-radius:999px;font:500 14px/1 var(--body);color:var(--muted);text-decoration:none;white-space:nowrap;transition:background .15s,color .15s}
.sitehead .tabs a:hover{color:var(--fg);background:var(--pill)}
.sitehead .tabs a[aria-current="page"]{color:var(--fg);background:var(--pill)}
.sitehead .acts{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.sitehead .hb{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:9px 16px;font:500 14px/1 var(--body);text-decoration:none;white-space:nowrap;border:1px solid transparent;cursor:pointer}
.sitehead .hb.solid{background:var(--ink-btn);color:var(--ink-btn-fg)}.sitehead .hb.solid:hover{opacity:.86}
.sitehead .hb.line{background:transparent;color:var(--fg);border-color:var(--line)}.sitehead .hb.line:hover{background:var(--pill)}
.sitehead .hb svg{width:15px;height:15px}
.sitehead a:focus-visible,.sitehead button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
@media (max-width:1180px){
 .sitehead .bar{grid-template-columns:auto auto;padding-block:10px 0;row-gap:6px}
 .sitehead .tabs{grid-column:1/-1;grid-row:2;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;padding-bottom:8px;margin-inline:-6px}
 .sitehead .tabs::-webkit-scrollbar{display:none}
 .sitehead .tabs a{min-width:0;flex:1 0 auto}
}
</style>
</head>

<script>
/* ============================================================
   AIV SETTINGS — edit these two lines before uploading
   ============================================================ */
const AIV_CONFIG = {
  // Option A (simple): paste your Groq key. Anyone can see it in the page source,
  // so use a key from a Groq account with NO payment method attached.
  groqKey: 'PASTE_YOUR_GROQ_KEY_HERE',
  // Option B (private, recommended): set your server address in config.js and AIV
  // uses it automatically. When it's set, groqKey is ignored. See server/SETUP.md.
  proxyUrl: (window.AIV_SITE&&window.AIV_SITE.server)?window.AIV_SITE.server.replace(/\/+$/,'')+'/site/chat':'',
  model: 'openai/gpt-oss-120b'
};

(()=>{
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORE='aiv.chat.v1';

const KNOWLEDGE=`ABOUT AI VERSE
AI Verse is an organization that delivers AI solutions for everyday tasks. Email: team@aiverse.it.com. Website pages: Home (index.html), Chatbot Builder (builder.html), Business (business.html), Data (data.html), API (api.html), Ask AIV chat (chat.html), Contact (contact.html).

APPS (free to use, run in the browser, data stays on the user's device; open from the Home page):
1. Learning Intelligence (apps/learning-intelligence.html) — adaptive AI tutor. Maps any topic into concepts, runs a diagnostic to find gaps, then adapts lessons, quizzes, flashcards, practice tests, slide decks, study guides, quick notes and expert step-by-step solutions. Research lab: summarizes pasted papers or PDFs with verified quotes, a methodology tutor (explain or Socratic mode), hypothesis and experiment planner, and scored scientific-writing practice.
2. Financial Intelligence (apps/financial-intelligence.html) — markets and money center. Market dashboard and watchlist, stock research with technical analysis, scorecard, backtests, Monte Carlo forecast ranges, company financials and news sentiment; portfolio tracking with allocation and risk; paper trading with a $100,000 practice account; a Live Predictor tab that streams prices during market hours and shows the live chance a stock closes higher today, expected closing and next-hour ranges, 1-day/1-week/1-month probabilities with ranges, what's driving the prediction, a reliability rating from an honest walk-forward backtest (labeled 'No proven edge' when the model hasn't beaten a simple baseline), price-range alerts, a watchlist scanner and an automatic track record; budgeting from uploaded CSV, PDF or photo bank statements; goals and net worth; an AI advisor that prepares changes for approval and never places real trades. Without a free Finnhub key it shows demo prices. Educational, not investment advice.
3. Aide (apps/aide.html) — personal assistant. Today view and daily briefing, AI time-blocked daily planner, calendar with "find a time", tasks with AI prioritization, reminders and birthdays, travel and event planning, Gmail triage and reply drafts (never sends email by itself), email/text writing, polishing and translation, voice commands and dictation, meeting summaries with action items. Optional Google Calendar and Gmail connection.
4. Fitness Intelligence (apps/fitness-intelligence.html) — AI training and nutrition coach. Builds a program for the user's goal, level, days and gym or home equipment; logs sets with rest timer and automatic weight progression; strength analytics; body measurements, body-fat estimate, progress photos (stay on device) and posture analysis; calorie and macro tracking with a food database, photo food recognition and meal descriptions; meal plans and grocery lists. General fitness guidance, not medical advice.

AI SETUP FOR THE APPS (each app: Settings → AI provider):
- AIV API key (recommended for full use): buy on api.html, then paste it in Settings → AI provider → AIV key. One key runs every AI Verse app at full strength. Each app also shows a 'Get AIV key' banner at the top.
- Clicking the 'AI off' badge in an app's top right starts downloading the free in-browser model right away (needs WebGPU: Chrome or Edge on a computer).
- Groq key (free tier, recommended for testing). Steps: go to console.groq.com and sign in (no credit card needed for the free tier); open API Keys and choose Create API Key, copy it (starts with gsk_, shown only once); in the app open Settings → AI provider → Groq key, paste, press Test connection.
- Other API key: OpenAI, OpenRouter, Google Gemini, Mistral, Together AI, DeepSeek or another OpenAI-compatible service.
- Local model: Ollama or LM Studio on the user's computer (needs OLLAMA_ORIGINS or CORS enabled).
- In-browser: small model downloads once (about 400 MB for the default) and runs on the graphics card in Chrome or Edge with WebGPU; works offline.
Keys are stored only in the user's browser and sent only to the chosen provider. Apps have Export backup and Erase everything in Settings.

CHATBOT BUILDER (builder.html) — AI Verse's main product: anyone can build an AI chatbot for their business by filling in a guided form (business name, description, hours, location, contact, services and prices, FAQs), adding their website address (it reads up to 6 pages), uploading files (PDF, Word .docx, TXT, MD, CSV; up to 5 files, 10 MB each) and pasting other text, then choosing a name, tone, first message and brand color. They can try it free with 3 messages. After that a purchase window appears: going live costs $150 + API billing (API billing covers the AI usage from the chatbot's conversations; rates are explained when the order is confirmed). Buying goes through the Business order form; the AI Verse team confirms details and switches the chatbot on. A live chatbot gets a chat bubble for the customer's website (one line of code) and a shareable link. There's a 'Try an example' button to see how it works.

BUSINESS (business.html): slogan "Give your business superpowers." AI Verse builds custom AI tools for businesses. Price: $150 + API billing. API billing means the business pays its own AI provider directly for usage (many, including Groq, have a free tier). Included: a custom AI tool built around the request, the business's name, logo and colors, setup with the business's own AI key, works on phones, tablets and computers, files the business owns and can host anywhere. Examples: customer support assistant, inbox and document helper, booking and planning, internal staff guide, marketing content studio, reports and dashboards. To order: click Buy now on the Business page and submit email, business name, first and last name, website and request. Nothing is charged on the site; the team emails to confirm details and arrange payment before work starts.

DATA (data.html): AI Verse licenses datasets it creates itself: research datasets, curated training data, benchmarks and synthetic data, plus custom datasets on request. It never collects or sells data from users of its apps. Pricing is quoted per request by email (depends on dataset, size and use); research and commercial licenses; terms agreed in writing before delivery; common formats such as CSV and JSON. To inquire: click Request data on the Data page and submit name, work email, company, website, data type, intended use and details. Nothing is charged on the site.

AIV API (api.html): developers can buy an AI Verse API key to use AIV models in their own apps. OpenAI-compatible: base URL is the AIV API address + /v1, endpoints POST /v1/chat/completions, GET /v1/models, GET /v1/usage, POST /v1/keys/rotate; auth header Authorization: Bearer <key>; keys start with aiv_live_. Models: aiv-1 (best quality) and aiv-1-mini (faster). Monthly plans billed through Stripe: Starter $9/month for 5,000 requests, Pro $29/month for 25,000, Business $99/month for 100,000. Each chat completion call is one request; up to 2,048 output tokens each; streaming supported. Over the limit returns error 429 until the 1st of next month or an upgrade. After checkout the key is shown once on api.html; save it. Usage check and key replacement are on api.html under My key; billing changes and cancellation in the Stripe billing portal. Prompts and answers are not stored. Lost keys can't be looked up; email team@aiverse.it.com.

CONTACT: contact.html form (first and last name, email, topic, message) or email team@aiverse.it.com.`;

const SYSTEM=`You are AIV, the friendly AI assistant on the AI Verse website. Today's date is ${new Date().toISOString().slice(0,10)}.
Answer questions about AI Verse using ONLY the facts below, and answer general questions (technology, AI, everyday tasks, learning, writing and so on) from your general knowledge.
Rules:
- Never invent AI Verse prices, features, policies, timelines, team members or discounts. If something about AI Verse isn't covered below, say you don't have that detail and suggest emailing team@aiverse.it.com or using the Contact page.
- When pointing to a page, link it with markdown, e.g. [Business page](business.html) or [Learning Intelligence](apps/learning-intelligence.html).
- Never ask for API keys, passwords or payment details. If someone shares one, tell them not to and to delete or regenerate it.
- For medical, legal, tax or investment questions give general information only and suggest a qualified professional.
- Be warm and concise: usually under 150 words, short paragraphs or bullets, no headings for short answers.

${KNOWLEDGE}`;

let msgs=[];try{msgs=JSON.parse(sessionStorage.getItem(STORE)||'[]');if(!Array.isArray(msgs))msgs=[];}catch(e){msgs=[];}
const persist=()=>{try{sessionStorage.setItem(STORE,JSON.stringify(msgs.slice(-40)));}catch(e){}};
let ctl=null,busy=false;

/* markdown-lite */
function inline(s){return s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
 .replace(/\[([^\]]+)\]\(((?:https?:\/\/|apps\/|[a-z-]+\.html)[^)\s]*)\)/g,(m,t,u)=>`<a href="${u}"${/^https?:/.test(u)?' target="_blank" rel="noopener"':''}>${t}</a>`);}
function md(t){const parts=esc(t).split(/```[\w-]*\n?/);return parts.map((p,i)=>{if(i%2)return`<pre>${p.replace(/\n$/,'')}</pre>`;let h='',L=null;const close=()=>{if(L){h+=`</${L}>`;L=null;}};for(const l of p.split('\n')){let m;if((m=l.match(/^\s*[-*•]\s+(.*)/))){if(L!=='ul'){close();h+='<ul>';L='ul';}h+=`<li>${inline(m[1])}</li>`;continue;}if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(L!=='ol'){close();h+='<ol>';L='ol';}h+=`<li>${inline(m[1])}</li>`;continue;}close();if((m=l.match(/^#{1,6}\s+(.*)/))){h+=`<h4>${inline(m[1])}</h4>`;continue;}if(l.trim())h+=`<p>${inline(l)}</p>`;}close();return h;}).join('');}

/* composer placement */
const comp=$('composerTpl').content.firstElementChild.cloneNode(true);
function place(){const chatting=msgs.length>0;$('start').hidden=chatting;$('thread').hidden=!chatting;$('dock').hidden=!chatting;$('newChat').hidden=!chatting;(chatting?$('dock'):$('composerSlot')).appendChild(comp);}
const input=()=>$('input');
function grow(){const t=input();t.style.height='auto';t.style.height=Math.min(t.scrollHeight,200)+'px';$('sendBtn').disabled=busy?false:!t.value.trim();}

/* rendering */
const avatar='<div class="av" aria-hidden="true"><svg><use href="#aiv"/></svg></div>';
function bubble(m,i){if(m.role==='user')return`<div class="msg me">${esc(m.content)}</div>`;return`<div class="msg ai">${avatar}<div><div class="md${m.error?' err':''}">${md(m.content)}</div>${m.error?'':`<div class="tools"><button type="button" data-copy="${i}">Copy</button>${i===msgs.length-1?'<button type="button" data-retry>Regenerate</button>':''}</div>`}</div></div>`;}
function render(){place();$('thread').innerHTML=msgs.map(bubble).join('');}
const toBottom=()=>{const s=$('scroll');s.scrollTop=s.scrollHeight;};

function setBusy(b){busy=b;const s=$('sendBtn');s.innerHTML=`<svg><use href="#${b?'stop':'up'}"/></svg>`;s.setAttribute('aria-label',b?'Stop':'Send');s.type=b?'button':'submit';grow();}

/* AI call (streaming) */
async function callAI(history,onDelta,signal){
  const body={model:AIV_CONFIG.model,stream:true,temperature:.5,max_completion_tokens:1200,messages:[{role:'system',content:SYSTEM},...history.slice(-16).map(m=>({role:m.role,content:m.content}))]};
  if(/gpt-oss/.test(AIV_CONFIG.model))body.reasoning_effort='low';
  let url,headers={'Content-Type':'application/json'};
  if(AIV_CONFIG.proxyUrl){url=AIV_CONFIG.proxyUrl;}
  else{if(!AIV_CONFIG.groqKey||/PASTE_/.test(AIV_CONFIG.groqKey))throw new Error('AIV isn\'t connected to an AI service yet. The site owner needs to add a Groq key in chat.html. In the meantime, email team@aiverse.it.com.');url='https://api.groq.com/openai/v1/chat/completions';headers.Authorization='Bearer '+AIV_CONFIG.groqKey;}
  let r;
  try{r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body),signal});}
  catch(e){if(e.name==='AbortError')throw e;throw new Error('AIV couldn\'t reach its AI service. Check your connection and try again.');}
  if(r.status===400&&body.reasoning_effort){delete body.reasoning_effort;r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body),signal});}
  if(!r.ok){if(r.status===429)throw new Error('AIV is getting a lot of questions right now. Please wait a minute and try again.');if(r.status===401||r.status===403)throw new Error('AIV\'s AI key was rejected. Please let us know at team@aiverse.it.com.');throw new Error(`AIV ran into a problem (error ${r.status}). Please try again.`);}
  const ct=r.headers.get('content-type')||'';
  if(!r.body||ct.includes('application/json')){const j=await r.json();onDelta(j.choices?.[0]?.message?.content||'');return;}
  const reader=r.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){const{done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line.startsWith('data:'))continue;const d=line.slice(5).trim();if(d==='[DONE]')return;try{const j=JSON.parse(d);const t=j.choices?.[0]?.delta?.content;if(t)onDelta(t);}catch(e){}}}
}

async function reply(){
  const i=msgs.push({role:'assistant',content:''})-1;render();
  const el=$('thread').lastElementChild.querySelector('.md');el.innerHTML='<span class="dots" aria-label="AIV is typing"><i></i><i></i><i></i></span>';toBottom();
  ctl=new AbortController();setBusy(true);
  let text='',raf=0;
  const paint=()=>{raf=0;el.innerHTML=md(text.replace(/<think>[\s\S]*?(<\/think>|$)/g,''));const s=$('scroll');if(s.scrollHeight-s.scrollTop-s.clientHeight<160)toBottom();};
  try{await callAI(msgs.slice(0,i),t=>{text+=t;if(!raf)raf=requestAnimationFrame(paint);},ctl.signal);
    text=text.replace(/<think>[\s\S]*?<\/think>/g,'').trim();msgs[i].content=text||'I don\'t have an answer for that. Try rephrasing your question.';}
  catch(e){if(e.name==='AbortError'){msgs[i].content=(text.trim()||'')+(text.trim()?'\n\n*Stopped.*':'*Stopped.*');}else{msgs[i]={role:'assistant',content:e.message,error:true};}}
  finally{ctl=null;setBusy(false);persist();render();toBottom();input().focus();}
}

function send(text){text=String(text||'').trim();if(!text||busy)return;msgs=msgs.filter(m=>!m.error);msgs.push({role:'user',content:text});input().value='';grow();render();toBottom();reply();}

/* events */
comp.addEventListener('submit',e=>{e.preventDefault();send(input().value);});
comp.addEventListener('input',grow);
comp.addEventListener('keydown',e=>{if(e.target.id==='input'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send(input().value);}});
comp.addEventListener('click',e=>{if(e.target.closest('#sendBtn')&&busy){e.preventDefault();ctl&&ctl.abort();}});
$('chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(c)send(c.textContent);});
$('newChat').onclick=()=>{if(busy&&ctl)ctl.abort();msgs=[];persist();render();input().focus();};
$('thread').addEventListener('click',async e=>{const c=e.target.closest('[data-copy]');if(c){try{await navigator.clipboard.writeText(msgs[+c.dataset.copy].content);c.textContent='Copied';setTimeout(()=>c.textContent='Copy',1500);}catch(_){c.textContent='Copy failed';}return;}
  if(e.target.closest('[data-retry]')&&!busy){if(msgs.length&&msgs[msgs.length-1].role==='assistant')msgs.pop();render();reply();}});

/* voice input */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
if(!SR)comp.querySelector('#micBtn').hidden=true;
comp.querySelector('#micBtn').addEventListener('click',()=>{const b=$('micBtn');if(rec){rec.stop();return;}rec=new SR();rec.lang=navigator.language||'en-US';rec.interimResults=true;const base=input().value?input().value.replace(/\s*$/,' '):'';rec.onresult=ev=>{let s='';for(const r of ev.results)s+=r[0].transcript;input().value=base+s;grow();};rec.onend=()=>{b.classList.remove('rec');rec=null;};rec.onerror=ev=>{if(ev.error==='not-allowed')input().placeholder='Microphone access was blocked';};try{rec.start();b.classList.add('rec');}catch(e){rec=null;}});

render();grow();if(msgs.length)toBottom();input().focus({preventScroll:true});
})();
</script>
</body>
</html>
